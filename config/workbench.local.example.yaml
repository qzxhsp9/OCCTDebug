{
  "schema_version": 1,
  "workspace": {
    "build_root": "out/build/debug",
    "case_root": "cases",
    "artifact_root": "artifacts"
  },
  "occt": {
    "source_root": "",
    "build_root": "",
    "install_root": "depends/occt",
    "casroot": "depends/occt",
    "drawexe": ""
  },
  "third_party": {
    "freetype_root": "depends/occt_3rdparty/freetype-2.13.3-x64",
    "tcltk_root": "depends/occt_3rdparty/tcltk-8.6.15-x64"
  },
  "qt": {
    "root": ""
  },
